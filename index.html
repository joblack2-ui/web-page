<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATHAR // الأثر</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --accent-color: #00ffcc;
            --danger-color: #ff3333;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Mysterious Future Interface Overlay */
        .temporal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            animation: scanline 8s linear infinite;
            opacity: 0.15;
            box-shadow: inset 0 0 100px rgba(0, 255, 204, 0.05), inset 0 0 200px rgba(0, 255, 204, 0.02);
        }

        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 800px;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 0.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--accent-color);
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            51% { opacity: 0.2; }
            52% { opacity: 1; }
            100% { opacity: 1; }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 2rem;
            letter-spacing: 0.2rem;
        }

        .status-bar {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 0.5rem 1rem;
            display: inline-block;
            background: rgba(0, 255, 204, 0.05);
        }

        .warning {
            color: var(--danger-color);
            font-size: 0.8rem;
            margin-top: 1rem;
            display: block;
        }

        /* Placeholder for existing app content */
        #app-root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="temporal-overlay"></div>
    <div class="container">
        <h1>ATHAR</h1>
        <div class="subtitle">الأثر // THE TRACE</div>
        <div class="status-bar">
            SYSTEM STATUS: <span id="system-status">CONNECTING TO TEMPORAL NODE...</span>
        </div>
        <span class="warning">UNVERIFIED — DON'T BELIEVE THIS AS FACT</span>
    </div>
    <div id="app-root"></div>

    <script>
        // Preserve the deliberate unknown-command redirect
        window.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('system-status');
            if (statusEl) {
                statusEl.textContent = 'ONLINE';
            }
            
            // Redirect logic for unknown commands/paths
            const path = window.location.pathname;
            if (path !== '/' && path !== '/index.html') {
                window.location.href = 'https://yasarblack.github.io/athar-social-app/';
            }
        });
    </script>
</body>
</html>
