<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="شمس — نافذتك اليومية إلى قصة عالمية ونكتة وبرج الدلو.">
  <title>شمس | نافذة اليوم</title>
  <link rel="stylesheet" href="css/shams.css">
  <link rel="stylesheet" href="css/daily-content.css">
</head>
<body>
  <main class="shams-lab">
    <header class="lab-header">
      <div>
        <span class="eyebrow">شمس / مختبر اليوم</span>
        <h1 id="site-title">شمس</h1>
        <p id="site-subtitle">قصة حقيقية من العالم، نكتة يومية، ونافذة برج الدلو.</p>
      </div>
      <span class="status-dot" id="site-status">متصلة</span>
    </header>
    <section class="tool-card">
      <div class="card-label">ومضة اليوم</div>
      <p class="date-line" id="today-date">—</p>
      <blockquote id="daily-quote">كل يوم يحمل شيئاً يستحق الاكتشاف.</blockquote>
      <small>ومضة قصيرة لبداية اليوم.</small>
    </section>
    <section id="daily-content-panel" class="tool-card" aria-labelledby="daily-content-heading">
      <header class="daily-panel-header">
        <div>
          <p class="daily-panel-kicker">شمس / محتوى اليوم</p>
          <h2 id="daily-content-heading">نافذة اليوم</h2>
        </div>
        <time id="daily-content-date"></time>
      </header>
      <div id="daily-content-root" aria-live="polite">
        <p class="daily-content-status">جارٍ تحميل محتوى اليوم…</p>
      </div>
    </section>
    <footer class="lab-footer">
      <span>شمس — محتوى يومي</span>
      <span>مصادر وروابط عند توفرها</span>
      <span>آخر تحديث يظهر داخل المحتوى</span>
    </footer>
  </main>
  <script type="module" src="js/shams.js"></script>
  <script type="module" src="js/daily-content.js"></script>
</body>
</html>
